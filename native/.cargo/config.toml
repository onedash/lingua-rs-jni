# Build settings that make the published native libraries portable. These live here rather
# than in CI so that a local `cargo build` produces the same artifact as a release.

[env]
# The oldest macOS the arm64 artifact must load on. Ignored by non-Apple linkers.
MACOSX_DEPLOYMENT_TARGET = "11.0"

[target.'cfg(all(windows, target_env = "msvc"))']
# Without this the DLL imports VCRUNTIME140.dll, so loading it fails on any Windows host
# without the Visual C++ Redistributable installed (Server Core and Nano Server images, for
# example). Statically linking the CRT leaves KERNEL32 as the only import.
rustflags = ["-Ctarget-feature=+crt-static"]

[target.x86_64-unknown-linux-musl]
# A JNI library is loaded into the existing musl JVM process, so it must be a dynamically
# loadable shared object rather than the musl target's default static-CRT output. The release
# Dockerfile additionally redirects libgcc_s to a static archive.
rustflags = ["-Ctarget-feature=-crt-static"]
